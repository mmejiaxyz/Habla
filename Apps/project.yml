name: Habla
options:
  bundleIdPrefix: com.habla
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  HablaUI:
    path: ../Packages/HablaUI
  # Paradee on the iPhone (needs Scripts/fetch-paradee.sh first; only the iPhone app links it).
  ParadeeKit:
    path: ../Packages/ParadeeKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "0"   # CI sets the real build number (see Scripts/build.sh)
targets:
  Habla:
    type: application
    platform: iOS
    sources: [Habla]
    dependencies:
      - package: HablaUI
      - package: ParadeeKit
    info:
      path: Habla/Info.plist
      properties:
        CFBundleDisplayName: Habla
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HablaBridgeURL: $(HABLA_BRIDGE_URL)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container]
        LSSupportsOpeningDocumentsInPlace: false
        # Pairing QR code in Habla on the Mac → habla://pair?... opens the app.
        CFBundleURLTypes:
          - CFBundleURLName: com.habla.pair
            CFBundleURLSchemes: [habla]
        NSLocalNetworkUsageDescription: Habla finds Habla on your Mac to download books and sync your place.
        NSCameraUsageDescription: Habla scans the QR code on your Mac to add it to your account.
        NSBonjourServices: [_habla._tcp]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.habla.app
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  HablaStudio:
    type: application
    platform: macOS
    sources:
      - HablaStudio
      - path: ../Tools/kokoro/install.sh
        buildPhase: resources
      - path: ../Tools/kokoro/kokoro_worker.py
        buildPhase: resources
    dependencies:
      - package: HablaUI
    info:
      path: HablaStudio/Info.plist
      properties:
        CFBundleDisplayName: Habla
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HablaBridgeURL: $(HABLA_BRIDGE_URL)
        CFBundleName: Habla
        LSApplicationCategoryType: public.app-category.books
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container]
        NSLocalNetworkUsageDescription: Habla shares your books with your iPhone on your home network.
        NSBonjourServices: [_habla._tcp]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.habla.studio
        PRODUCT_NAME: Habla
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
